services:
  # --- Модель OLLAMA ---
  ollama:
    image: ollama/ollama:latest
    container_name: ai_ollama_core
    ports:
      - "11435:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ai-shared-net
  
    # --- Модель QWEN ---
  qwen:
    image: ollama/ollama:latest
    container_name: ai_qwen_core
    ports:
      - "11438:11434"
    volumes:
      - qwen_storage:/root/.ollama
    environment:
      - TZ=Europe/Ekaterinburg
      - OLLAMA_NUM_PARALLEL=4
    networks:
      - ai-shared-net
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5-coder:1.5b && tail -f /dev/null" ]

    # --- KOKORO TTS ---
  kokoro-tts:
    image: hwdsl2/kokoro-server:latest
    container_name: kokoro-tts
    ports:
      - "11436:8880"
    volumes:
      - kokoro-cache:/root/.cache
    environment:
      - TZ=Europe/Ekaterinburg
    restart: unless-stopped
    networks:
      - ai-shared-net

  # --- ХРАНИЛИЩЕ СЕКРЕТОВ HASHICORP VAULT (ПЕРМАНЕНТНОЕ) ---
  vault:
    image: hashicorp/vault:1.15
    container_name: ai_vault_core
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_MASTER_TOKEN}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - TZ=Europe/Ekaterinburg
    volumes:
      - vault_storage:/vault/file
    restart: unless-stopped
    networks:
      - ai-shared-net

  # --- ЯДРО БАЗЫ ДАННЫХ INFLUXDB 3 CORE ---
  influxdb:
    image: influxdb:3-core
    container_name: influxdb3_core
    user: "root"
    ports:
      - "8181:8080"  # На внешку отдаем 8181, внутри докер-сети слушаем 8080!
    volumes:
      - influxdb3_storage:/var/lib/influxdb3/data
    environment:
      - INFLUXDB3_NODE_ID=node0
      - INFLUXDB3_OBJECT_STORE=file
      - INFLUXDB3_DATA_DIR=/var/lib/influxdb3/data
      - INFLUXDB_INITIAL_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
      - TZ=Europe/Ekaterinburg
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    networks:
      - ai-shared-net

  # --- ГРАФИЧЕСКИЙ ИНТЕРФЕЙС GRAFANA ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль администратора при первом входе
      - TZ=Europe/Ekaterinburg
    restart: unless-stopped
    networks:
      - ai-shared-net

volumes:
  ollama_storage:
  qwen_storage:
  kokoro-cache:
  influxdb3_storage:
  vault_storage:
  grafana-storage:

networks:
  ai-shared-net:
    driver: bridge
    name: ai-shared-net
