services:
  ai-agent:
    build: .
    container_name: ai_kane_agent
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Ekaterinburg
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    env_file:
      - .env
    external_links:
      - "minio_core:minio-core"
    networks:
      - docker-net

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: ai_dragonfly
    # Ограничиваем память, если нужно (например, --maxmemory=2gb)
    command: ["--logtostderr", "--bind", "0.0.0.0"]
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - docker-net

volumes:
  dragonfly_data:

networks:
  docker-net:
    external: true