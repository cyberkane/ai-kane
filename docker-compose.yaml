services:
  ai-agent:
    build: .
    container_name: ai_agent
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Ekaterinburg
      - PYTHONUNBUFFERED=1
      - VAULT_MASTER_TOKEN=${VAULT_MASTER_TOKEN}
      - INFLUX_BOOTSTRAP_TOKEN=${INFLUX_BOOTSTRAP_TOKEN}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    env_file:
      - .env
    external_links:
      - "minio_core:minio-core"
    networks:
      - docker-net

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: dragonfly
    # Ограничиваем память, если нужно (например, --maxmemory=2gb)
    command: ["--logtostderr", "--bind", "0.0.0.0"]
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - docker-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API (для быстрой работы через библиотеки)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - TZ=Europe/Ekaterinburg
    restart: unless-stopped
    networks:
      - docker-net

volumes:
  dragonfly_data:
  qdrant_storage:

networks:
  docker-net:
    external: true